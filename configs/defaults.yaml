# configs/defaults.yaml
# Shared trainer defaults. LightningCLI merges multiple --config files left to right, so layer it under any
# domain config:
#
#   python scripts/train.py fit --config configs/defaults.yaml --config configs/vision/classifier.yaml
#
# The domain configs are also complete on their own; this file only exists to show config layering.

seed_everything: 42

trainer:
  accelerator: auto
  devices: auto
  precision: 32-true          # use 16-mixed / bf16-mixed on GPU
  max_epochs: 10
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  deterministic: false
  benchmark: true
  enable_progress_bar: true
  enable_model_summary: true
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.RichModelSummary
      init_args:
        max_depth: 2
