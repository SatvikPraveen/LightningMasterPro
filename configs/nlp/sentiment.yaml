# configs/nlp/sentiment.yaml
# python scripts/train.py fit --config configs/nlp/sentiment.yaml

seed_everything: 42

model:
  class_path: lmpro.modules.nlp.sentiment.SentimentClassifier
  init_args:
    vocab_size: 5000
    num_classes: 3
    embedding_dim: 128
    hidden_dim: 256
    num_layers: 2
    dropout: 0.3
    architecture: lstm           # lstm | gru | cnn | attention
    learning_rate: 2.0e-4
    weight_decay: 1.0e-4
    optimizer: adamw
    scheduler: onecycle
    max_sequence_length: 128

data:
  class_path: lmpro.datamodules.nlp_dm.NLPDataModule
  init_args:
    task: classification
    data_config:
      num_samples: 2000
      vocab_size: 5000
      max_sequence_length: 128
      min_sequence_length: 10
      num_classes: 3
    batch_size: 32
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    max_length: 128

trainer:
  max_epochs: 15
  accelerator: auto
  devices: 1
  precision: 32-true
  gradient_clip_val: 0.5
  accumulate_grad_batches: 1
  log_every_n_steps: 10
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: logs
      name: nlp_sentiment
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/nlp/sentiment
        filename: "epoch{epoch:02d}-step{step}"
        auto_insert_metric_name: false
        monitor: val/acc
        mode: max
        save_top_k: 3
        save_last: true
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/acc
        mode: max
        patience: 6
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
