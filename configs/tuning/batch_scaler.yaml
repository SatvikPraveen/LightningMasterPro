# configs/tuning/batch_scaler.yaml
# Consumed by scripts/scale_batch.py. The batch_scaler mapping is passed verbatim to
# lightning.pytorch.tuner.Tuner.scale_batch_size(model, datamodule=..., **batch_scaler).
#
#   python scripts/scale_batch.py --config configs/vision/classifier.yaml --tuning_config configs/tuning/batch_scaler.yaml

batch_scaler:
  mode: power            # power (double until OOM) | binsearch (then bisect)
  steps_per_trial: 3
  init_val: 2
  max_trials: 6
  batch_arg_name: batch_size   # attribute on the datamodule that the tuner mutates
