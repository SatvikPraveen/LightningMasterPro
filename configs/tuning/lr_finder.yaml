# configs/tuning/lr_finder.yaml
# Consumed by scripts/tune_lr.py. The lr_finder mapping is passed verbatim to
# lightning.pytorch.tuner.Tuner.lr_find(model, datamodule=..., **lr_finder).
#
#   python scripts/tune_lr.py --config configs/vision/classifier.yaml --tuning_config configs/tuning/lr_finder.yaml

lr_finder:
  min_lr: 1.0e-6
  max_lr: 1.0
  num_training: 100          # number of steps in the range test
  mode: exponential          # exponential | linear
  early_stop_threshold: 4.0  # stop once loss > threshold * best loss
  update_attr: false         # true would write the suggestion into model.learning_rate in place
