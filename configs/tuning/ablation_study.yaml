# configs/tuning/ablation_study.yaml
# Consumed by scripts/run_ablation.py. Every combination of `parameters` is written
# into a copy of the base config (dotted keys address nested YAML) and trained with
# `LightningMasterCLI(args=["fit", "--config", ...])`.
#
#   python scripts/run_ablation.py --config configs/vision/classifier.yaml \
#       --ablation_config configs/tuning/ablation_study.yaml --max_combinations 4

ablation:
  experiment_name: classifier_lr_wd_dropout

  parameters:
    model.init_args.learning_rate: [1.0e-4, 1.0e-3]
    model.init_args.weight_decay: [0.0, 1.0e-4]
    model.init_args.dropout: [0.1, 0.3]

  # Applied to trainer.* of every run so the sweep stays cheap.
  trainer_overrides:
    max_epochs: 2
    limit_train_batches: 20
    limit_val_batches: 5

  # Read from trainer.callback_metrics after each fit. The first one picks the best run.
  metrics:
    - val/loss
    - val/acc
