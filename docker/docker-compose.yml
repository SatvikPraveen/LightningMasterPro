services:
  lmpro:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lightningmasterpro:latest
    container_name: lmpro
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../checkpoints:/app/checkpoints
    environment:
      - PYTHONUNBUFFERED=1
    command: python scripts/train.py fit --config configs/vision/classifier.yaml --trainer.max_epochs 1

  lmpro-jupyter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lightningmasterpro:latest
    container_name: lmpro-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../checkpoints:/app/checkpoints
      - ../notebooks:/app/notebooks
    environment:
      - PYTHONUNBUFFERED=1
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --notebook-dir=/app/notebooks

  lmpro-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lightningmasterpro:latest
    container_name: lmpro-dev
    volumes:
      - ..:/app
    environment:
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    command: /bin/bash
